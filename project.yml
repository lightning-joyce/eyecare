name: EyeCare
options:
  bundleIdPrefix: net.gltlab
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "4"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
targets:
  EyeCare:
    type: application
    platform: macOS
    sources:
      - path: EyeCare
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gltlab.eyecare
        INFOPLIST_FILE: Config/Info.plist
        EYECARE_UPDATE_FEED_URL: https://eyecare-updates.gltlab.net/appcast.xml
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
  EyeCareTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - EyeCare/BreakSchedule.swift
      - EyeCare/WorkTimer.swift
      - EyeCare/ReadingSize.swift
      - EyeCare/BrowserTextSize.swift
      - EyeCareTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
schemes:
  EyeCare:
    build:
      targets:
        EyeCare: all
    test:
      targets:
        - EyeCareTests

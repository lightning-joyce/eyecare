name: EyeCare
options:
  bundleIdPrefix: net.gltlab
  developmentLanguage: en
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EyeCare:
    type: application
    platform: macOS
    sources:
      - path: EyeCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gltlab.eyecare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  EyeCare:
    build:
      targets:
        EyeCare: all
